<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nawi - Traductor</title>
    <link rel="stylesheet" href="frontend/style_nav.css" />
    <link rel="stylesheet" href="frontend/styles.css" />
</head>

<body>
    <!-- NAVBAR-->
    <nav class="nav">
        <a class="nav__brand" href="#">
            <img class="nav__logo-img" src="frontend/assets/logo_v.png" alt="NEWI">
            <span class="nav__title">NAWI</span>
        </a>

        <div class="nav__menu">
            <button id="menuBtn" class="nav__btn" aria-expanded="false" aria-controls="menuList"><img src="frontend/assets/icons/menu.png" alt="menu"></button>
            <ul id="menuList" class="nav__dropdown" hidden>
                <li><a href="index.html">Newi</a></li>
                <li><a href="frontend/diccionario.html">Diccionario</a></li>
                <li><a href="frontend/juego.html">Juego</a></li>
                <li><a href="frontend/informacion.html">Información</a></li>
            </ul>
        </div>
    </nav>

    <!--INICIO TRADUCTOR***************************************************-->
    <main class="container">
        <!-- TRADUCTOR -->
        <section id="funciones" class="app">
            <header class="app__header">
                <div class="bar">
                    <label class="sr-only" for="src">Idioma origen</label>
                    <!-- Origen -->
                    <select id="src">
                        <option value="auto" disabled>Detectar idioma</option>
                        <option value="es" selected>Español</option>
                        <option value="nah" disabled>Náhuatl (x)</option>
                        <option value="yua" disabled>Maya (x)</option>
                        <option value="zai" disabled>Zapoteco (x)</option>
                        <option value="mie" disabled>Mixteco (x)</option>

                    </select>

                    <button id="swap" title="Intercambiar"><img src="frontend/assets/icons/compare.png" alt="Intercambiar"></button>

                    <select id="tgt">
                        <option value="es">Español</option>
                        <option value="nah" selected>Náhuatl (x)</option>
                        <option value="yua">Maya (x)</option>
                        <option value="zai">Zapoteco (x)</option>
                        <option value="mie">Mixteco (x)</option>
                    </select>


                </div>
            </header>

            <div class="grid">
                <section>
                    <div class="ta-wrap">
                        <textarea id="input" placeholder="Escribe para traducir..."></textarea>

                        <!-- Botones dentro del textarea -->
                        <div class="ta-actions ta-actions--left">
                            <button id="speakIn"><img src="frontend/assets/icons/mic.png" alt="microfono"></button>
                            <button id="translate">Traducir</button>
                        </div>
                    </div>
                </section>


                <section>
                    <div class="ta-wrap">
                        <textarea id="output" placeholder="Traducción..." readonly></textarea>

                        <!-- Botones dentro del textarea -->
                        <div class="ta-actions ta-actions--right">
                            <button id="copy"><img src="frontend/assets/icons/copy.png" alt="copiar"></button>
                            <button id="speakOut"><img src="frontend/assets/icons/volume_up2.png" alt="escuchar"></button>

                            <label class="gloss-check">
                                <input type="checkbox" id="gloss" /> Mostrar glosado
                            </label>
                        </div>
                    </div>
                    <!-- glosado-->
                    <div id="glossPanel" class="gloss-panel" hidden></div>

                    <div class="small" id="perf"></div>


                    <div class="small" id="perf"></div>
                </section>

            </div>
        </section>
    </main>
    <!--FIN TRADUCTOR***************************************************-->

    <!--PIE DE PÁGINA-->
    <footer class="site-footer">
        <div class="footer-grid">
            <section>
                <h3>Sobre nosotros</h3>
                <p>NAWI es un proyecto de traducción y preservación lingüística.</p>
                <p><small>© <span id="y"></span> NEWI</small></p>
            </section>

            <section>
                <h3>Enlaces</h3>
                <ul class="list">
                    <li><a href="#acerca">Acerca de NAWI</a></li>
                    <li><a href="#terminos">Términos y privacidad</a></li>
                    <li><a href="#documentacion">Documentación</a></li>
                </ul>
            </section>

            <section>
                <h3>Redes</h3>
                <ul class="list">
                    <li><a href="https://instagram.com/tu_cuenta" target="_blank" rel="noopener">Instagram</a></li>
                    <li><a href="https://youtube.com/@tu_cuenta" target="_blank" rel="noopener">YouTube</a></li>
                </ul>
            </section>
        </div>
    </footer>

    <script>
        // año dinámico
        document.getElementById('y').textContent = new Date().getFullYear();
    </script>



    <script src="frontend/nav.js" defer></script>
    <script src="backend/tra_back.js" defer></script>
</body>

</html>
